<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Launchpad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #18181c;
    --pad-empty: #1e1e24;
    --pad-border: #2a2a35;
    --playing: #ff2d55;
    --text: #e8e8f0;
    --muted: #44445a;
    --accent: #ff2d55;
    --green: #00ff88;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }

  /* ---- MODE SELECT ---- */
  #mode-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 100;
  }

  #mode-screen .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2em;
  }
  #mode-screen .logo span { color: var(--accent); }

  .mode-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 240px;
  }

  .mode-btn {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    border: none;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: filter 0.1s;
  }
  .mode-btn:active { filter: brightness(1.3); }
  .mode-btn.preset  { background: var(--accent); color: white; }
  .mode-btn.manual  { background: var(--surface); color: var(--text); border: 1px solid var(--pad-border); }

  .mode-desc {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* ---- APP ---- */
  #app {
    display: none;
    flex-direction: column;
    height: 100dvh;
    padding: 12px;
    gap: 10px;
  }
  #app.visible { display: flex; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .logo-small { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
  .logo-small span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 10px; }

  #mode-badge {
    font-size: 9px;
    padding: 3px 7px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  #mode-badge.preset { background: var(--accent); color: white; }
  #mode-badge.manual { background: var(--surface); color: var(--muted); border: 1px solid var(--pad-border); }

  #midi-status {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #midi-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  #midi-dot.connected { background: var(--green); }

  #now-playing {
    background: var(--surface);
    border: 1px solid var(--pad-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }
  #now-playing-name { color: var(--accent); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #playing-bar { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  #playing-bar span { width: 3px; height: 14px; background: var(--accent); border-radius: 2px; opacity: 0; transition: opacity 0.2s; }
  #playing-bar.active span { opacity: 1; animation: bounce 0.6s infinite alternate; }
  #playing-bar.active span:nth-child(2) { animation-delay: 0.1s; }
  #playing-bar.active span:nth-child(3) { animation-delay: 0.2s; }
  @keyframes bounce { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

  #grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; width: min(100%, 100vw - 24px); aspect-ratio: 1; }

  .pad {
    aspect-ratio: 1;
    border-radius: 6px;
    background: var(--pad-empty);
    border: 1px solid var(--pad-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.08s, filter 0.08s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
  }
  .pad.has-clip { border-color: #333360; }
  .pad.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pad.playing { background: var(--playing) !important; border-color: var(--playing); }
  .pad:active { transform: scale(0.88); filter: brightness(1.3); }

  .pad-label { font-size: 7px; color: rgba(255,255,255,0.6); text-align: center; padding: 2px; line-height: 1.2; overflow: hidden; max-width: 100%; word-break: break-all; }

  /* Panel (manual only) */
  #panel {
    background: var(--surface);
    border: 1px solid var(--pad-border);
    border-radius: 10px;
    padding: 10px 12px;
    flex-shrink: 0;
    display: none;
    gap: 10px;
    flex-direction: column;
  }
  #panel.visible { display: flex; }

  .panel-row { display: flex; align-items: center; gap: 8px; }
  .panel-label { font-size: 10px; color: var(--muted); flex-shrink: 0; width: 50px; }
  .panel-value { font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  .btn { font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; border: none; border-radius: 6px; padding: 7px 10px; cursor: pointer; letter-spacing: 0.05em; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: #2a1820; color: #ff6b6b; }

  .color-swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--pad-border); cursor: pointer; flex-shrink: 0; }
  input[type="color"] { opacity: 0; position: absolute; width: 0; height: 0; }
  input[type="file"] { display: none; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--surface); border: 1px solid var(--pad-border); color: var(--text); font-size: 11px; padding: 8px 16px; border-radius: 20px; transition: transform 0.25s; pointer-events: none; white-space: nowrap; z-index: 99; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- MODE SELECT -->
<div id="mode-screen">
  <div class="logo"><span>LAUNCH</span>PAD</div>
  <div class="mode-buttons">
    <button class="mode-btn preset" onclick="startApp('preset')">PRESET</button>
    <button class="mode-btn manual" onclick="startApp('manual')">MANUELL</button>
  </div>
  <div class="mode-desc">
    Preset lädt vorkonfigurierte Clips.<br>
    Manuell: Clips selbst zuweisen.
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo-small"><span>LAUNCH</span>PAD</div>
    <div class="header-right">
      <div id="mode-badge">—</div>
      <div id="midi-status">
        <div id="midi-dot"></div>
        <span id="midi-label">kein MIDI</span>
      </div>
    </div>
  </header>

  <div id="now-playing">
    <span style="color:var(--muted)">▶</span>
    <span id="now-playing-name">—</span>
    <div id="playing-bar"><span></span><span></span><span></span></div>
  </div>

  <div id="grid-wrap">
    <div id="grid"></div>
  </div>

  <div id="panel">
    <div class="panel-row">
      <span class="panel-label">PAD</span>
      <span class="panel-value" id="panel-pad">—</span>
    </div>
    <div class="panel-row">
      <span class="panel-label">CLIP</span>
      <span class="panel-value" id="panel-clip">kein Clip</span>
    </div>
    <div class="panel-row">
      <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">CLIP LADEN</button>
      <button class="btn btn-danger" onclick="removeClip()">ENTFERNEN</button>
      <div style="position:relative; margin-left:auto;">
        <div class="color-swatch" id="color-swatch" onclick="document.getElementById('color-input').click()"></div>
        <input type="color" id="color-input" onchange="setColor(this.value)">
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".wav,.mp3,.ogg" onchange="assignClip(this)">
<div id="toast"></div>

<script src="preset.js"></script>
<script>
const GRID = 8;
const state = {
  clips: {},
  selected: null,
  playing: {},   // key -> AudioBufferSourceNode
  audioCtx: null,
  mode: null,
};

// --- Mode ---
function startApp(mode) {
  state.mode = mode;
  document.getElementById('mode-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');

  const badge = document.getElementById('mode-badge');
  badge.textContent = mode === 'preset' ? 'PRESET' : 'MANUELL';
  badge.className = 'mode-badge ' + mode;

  buildGrid();

  if (mode === 'preset') loadPreset();

  initMIDI();
}

function loadPreset() {
  if (typeof PRESET === 'undefined') { toast('preset.js nicht gefunden'); return; }
  let count = 0;
  const promises = Object.entries(PRESET).map(([key, cfg]) => {
    return fetch(cfg.clip)
      .then(r => { if (!r.ok) throw new Error(); return r.blob(); })
      .then(blob => {
        const url = URL.createObjectURL(blob);
        state.clips[key] = { name: cfg.name || cfg.clip.split('/').pop().replace(/\.[^.]+$/, ''), url, color: cfg.color || '#1a1a40' };
        updatePad(key);
        count++;
      })
      .catch(() => toast(`Clip nicht gefunden: ${cfg.clip}`));
  });
  Promise.all(promises).then(() => toast(`${count} Clips geladen`));
}

// --- Audio ---
function getAudioCtx() {
  if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
  return state.audioCtx;
}

async function playClip(key) {
  const clip = state.clips[key];
  if (!clip) return;
  const ctx = getAudioCtx();

  // Gleichen Sound neu starten: alten stoppen
  if (state.playing[key]) {
    try { state.playing[key].stop(); } catch(e) {}
    delete state.playing[key];
    const pad = document.querySelector(`[data-key="${key}"]`);
    if (pad) pad.classList.remove('playing');
  }

  const response = await fetch(clip.url);
  const arrayBuffer = await response.arrayBuffer();
  const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
  const source = ctx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(ctx.destination);
  source.start();

  state.playing[key] = source;

  document.getElementById('now-playing-name').textContent = clip.name;
  document.getElementById('playing-bar').classList.add('active');

  const pad = document.querySelector(`[data-key="${key}"]`);
  if (pad) pad.classList.add('playing');

  source.onended = () => {
    if (state.playing[key] === source) {
      delete state.playing[key];
      if (pad) pad.classList.remove('playing');
      // "Now playing" nur leeren wenn nichts mehr spielt
      if (Object.keys(state.playing).length === 0) {
        document.getElementById('now-playing-name').textContent = '—';
        document.getElementById('playing-bar').classList.remove('active');
      }
    }
  };
}

// --- Grid ---
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const key = `${x},${y}`;
      const pad = document.createElement('div');
      pad.className = 'pad';
      pad.dataset.key = key;
      pad.innerHTML = `<span class="pad-label"></span>`;
      pad.addEventListener('click', () => onPadClick(key));
      grid.appendChild(pad);
    }
  }
}

function updatePad(key) {
  const pad = document.querySelector(`[data-key="${key}"]`);
  if (!pad) return;
  const clip = state.clips[key];
  const label = pad.querySelector('.pad-label');
  if (clip) {
    pad.classList.add('has-clip');
    label.textContent = clip.name.length > 8 ? clip.name.slice(0,7) + '…' : clip.name;
    pad.style.background = clip.color || '#1a1a40';
    pad.style.borderColor = clip.color || '#1a1a40';
  } else {
    pad.classList.remove('has-clip');
    label.textContent = '';
    pad.style.background = '';
    pad.style.borderColor = '';
  }
}

function onPadClick(key) {
  if (state.selected) {
    const prev = document.querySelector(`[data-key="${state.selected}"]`);
    if (prev) prev.classList.remove('selected');
  }
  state.selected = key;
  const pad = document.querySelector(`[data-key="${key}"]`);
  pad.classList.add('selected');

  if (state.mode === 'manual') {
    const [x, y] = key.split(',');
    document.getElementById('panel-pad').textContent = `(${x}, ${y})`;
    const clip = state.clips[key];
    document.getElementById('panel-clip').textContent = clip ? clip.name : 'kein Clip';
    document.getElementById('color-swatch').style.background = clip?.color || '#1a1a40';
    document.getElementById('color-input').value = clip?.color || '#1a1a40';
    document.getElementById('panel').classList.add('visible');
  }

  if (state.clips[key]) playClip(key);
}

// --- Manual ---
function assignClip(input) {
  if (!state.selected || !input.files[0]) return;
  const file = input.files[0];
  const url = URL.createObjectURL(file);
  const existing = state.clips[state.selected];
  state.clips[state.selected] = {
    name: file.name.replace(/\.[^.]+$/, ''),
    url, color: existing?.color || '#1e2060'
  };
  updatePad(state.selected);
  document.getElementById('panel-clip').textContent = state.clips[state.selected].name;
  document.getElementById('color-swatch').style.background = state.clips[state.selected].color;
  input.value = '';
  toast('Clip geladen');
}

function removeClip() {
  if (!state.selected) return;
  delete state.clips[state.selected];
  updatePad(state.selected);
  document.getElementById('panel-clip').textContent = 'kein Clip';
  toast('Clip entfernt');
}

function setColor(color) {
  if (!state.selected) return;
  if (state.clips[state.selected]) {
    state.clips[state.selected].color = color;
    updatePad(state.selected);
  }
  document.getElementById('color-swatch').style.background = color;
}

// --- MIDI ---
async function initMIDI() {
  if (!navigator.requestMIDIAccess) {
    document.getElementById('midi-label').textContent = 'kein Web MIDI';
    return;
  }
  try {
    const midi = await navigator.requestMIDIAccess();
    const update = () => {
      let found = false;
      midi.inputs.forEach(input => {
        if (input.name.toLowerCase().includes('launchpad')) {
          found = true;
          input.onmidimessage = onMIDIMessage;
        }
      });
      document.getElementById('midi-dot').className = found ? 'connected' : '';
      document.getElementById('midi-label').textContent = found ? 'Launchpad verbunden' : 'kein Launchpad';
    };
    update();
    midi.onstatechange = update;
  } catch(e) {
    document.getElementById('midi-label').textContent = 'MIDI verweigert';
  }
}

function onMIDIMessage(e) {
  const [status, note, velocity] = e.data;
  if ((status & 0xf0) === 0x90 && velocity > 0) {
    const x = note % 16;
    const y = Math.floor(note / 16);
    if (x < 8 && y < 8) onPadClick(`${x},${y}`);
  }
}

// --- Toast ---
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
</script>
</body>
</html>
